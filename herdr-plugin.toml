id = "fantoine.run-targets"
name = "Run Targets"
version = "0.5.0"
min_herdr_version = "0.8.2"
description = "Launch, stop and restart a repository's dev services from a dashboard pane"
platforms = ["linux", "macos"]

[[actions]]
id = "toggle"
title = "Run targets"
contexts = ["workspace"]
command = ["sh", "-c", "exec python3 \"$HERDR_PLUGIN_ROOT/toggle.py\""]

[[panes]]
id = "dashboard"
title = "Run targets"
placement = "overlay"
command = ["sh", "-c", "exec python3 \"$HERDR_PLUGIN_ROOT/dashboard.py\""]

# Keep the Spaces sidebar's service counts current while the dashboard is
# closed: a crashed service shows up on the next tab or workspace switch.
[[events]]
on = "workspace.focused"
command = ["sh", "-c", "exec python3 \"$HERDR_PLUGIN_ROOT/report_badges.py\""]

[[events]]
on = "tab.focused"
command = ["sh", "-c", "exec python3 \"$HERDR_PLUGIN_ROOT/report_badges.py\""]
